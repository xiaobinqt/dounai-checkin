name: Dounai session

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        default: checkin
        type: choice
        options:
          - checkin
          - keepalive
  schedule:
    # 每三小时验证并刷新登录态。
    - cron: "23 */3 * * *"
      timezone: "Asia/Shanghai"
    # 每天北京时间 10:17 签到。
    - cron: "17 10 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: read

concurrency:
  group: dounai-session
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout public source
        uses: actions/checkout@v7
        with:
          repository: xiaobinqt/dounai-checkin
          ref: main
          path: source
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: source/go.mod
          cache: true
          cache-dependency-path: source/go.sum

      - name: Test
        working-directory: source
        run: go test ./...

      - name: Build
        working-directory: source
        run: go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/dounai" .

      - name: Validate configuration
        env:
          DOUNAI_URL: ${{ secrets.DOUNAI_URL }}
          DOUNAI_COOKIE: ${{ secrets.DOUNAI_COOKIE }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          missing=()
          for name in DOUNAI_URL DOUNAI_COOKIE BARK_KEY; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required repository secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Keep alive or check in
        env:
          DOUNAI_URL: ${{ secrets.DOUNAI_URL }}
          DOUNAI_COOKIE: ${{ secrets.DOUNAI_COOKIE }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER || 'https://api.day.app' }}
          MANUAL_OPERATION: ${{ inputs.operation }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          operation="keepalive"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            operation="$MANUAL_OPERATION"
          elif [[ "$EVENT_SCHEDULE" == "17 10 * * *" ]]; then
            operation="checkin"
          fi
          "$RUNNER_TEMP/dounai" "$operation"
