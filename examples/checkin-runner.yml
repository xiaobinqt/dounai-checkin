name: Dounai session
run-name: Dounai ${{ inputs.operation || (github.event.schedule == '17 9 * * *' && 'checkin' || 'keepalive') }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        default: checkin
        type: choice
        options:
          - checkin
          - keepalive
  schedule:
    # 每三小时验证并刷新登录态。
    - cron: "23 */3 * * *"
      timezone: "Asia/Shanghai"
    # 每天只自动签到一次，失败后当天不再自动重试。
    - cron: "17 9 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: read

concurrency:
  group: dounai-session
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Plan operation
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_OPERATION: ${{ inputs.operation }}
        run: |
          operation="keepalive"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            operation="$MANUAL_OPERATION"
          elif [[ "$EVENT_SCHEDULE" == "17 9 * * *" ]]; then
            operation="checkin"
          fi

          printf 'operation=%s\n' "$operation" >> "$GITHUB_OUTPUT"

      - name: Checkout public source
        uses: actions/checkout@v7
        with:
          repository: xiaobinqt/dounai-checkin
          ref: main
          path: source
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: source/go.mod
          cache: true
          cache-dependency-path: source/go.sum

      - name: Test
        working-directory: source
        run: go test ./...

      - name: Build
        working-directory: source
        run: go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/dounai" .

      - name: Install captcha OCR assets
        run: |
          mkdir -p source/models
          curl -fsSL -o source/models/common_old.onnx https://github.com/yangbin1322/go-ddddocr/releases/download/v1.0.1/common_old.onnx
          curl -fsSL -o source/models/charsets_old.json https://github.com/yangbin1322/go-ddddocr/releases/download/v1.0.1/charsets_old.json
          curl -fsSL https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-linux-x64-1.23.2.tgz |
            tar -xz -C source/models --strip-components=2 onnxruntime-linux-x64-1.23.2/lib/libonnxruntime.so.1.23.2
          mv source/models/libonnxruntime.so.1.23.2 source/models/libonnxruntime.so

      - name: Validate configuration
        env:
          DOUNAI_URL: ${{ secrets.DOUNAI_URL }}
          DOUNAI_COOKIE: ${{ secrets.DOUNAI_COOKIE }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          missing=()
          for name in DOUNAI_URL DOUNAI_COOKIE BARK_KEY; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required repository secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Keep alive or check in
        id: run
        env:
          DOUNAI_URL: ${{ secrets.DOUNAI_URL }}
          DOUNAI_COOKIE: ${{ secrets.DOUNAI_COOKIE }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER || 'https://api.day.app' }}
          EMAIL: ${{ secrets.EMAIL }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT || '0' }}
          EMAIL_AUTH_CODE: ${{ secrets.EMAIL_AUTH_CODE }}
          EMAIL_TLS: ${{ secrets.EMAIL_TLS || 'false' }}
          DOUNAI_COOKIE_OUTPUT: ${{ runner.temp }}/dounai-session/cookie
          DOUNAI_OCR_MODEL_DIR: ${{ github.workspace }}/source/models
          OPERATION: ${{ steps.plan.outputs.operation }}
        run: |
          printf 'operation=%s\n' "$OPERATION" >> "$GITHUB_OUTPUT"
          mkdir -p "$(dirname "$DOUNAI_COOKIE_OUTPUT")"
          "$RUNNER_TEMP/dounai" "$OPERATION"

      - name: Persist refreshed cookie
        if: ${{ always() }}
        env:
          COOKIE_FILE: ${{ runner.temp }}/dounai-session/cookie
          GH_TOKEN: ${{ secrets.COOKIE_UPDATE_TOKEN }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
        run: |
          if [[ -s "$COOKIE_FILE" ]]; then
            trap 'shred -u "$COOKIE_FILE"' EXIT
          fi

          if [[ "$RUN_OUTCOME" != "success" ]]; then
            exit 0
          fi

          if [[ ! -s "$COOKIE_FILE" ]]; then
            printf '::notice::No cookie changes; DOUNAI_COOKIE remains unchanged.\n'
            printf '### Cookie persistence\n\nNo cookie changes; `DOUNAI_COOKIE` remains unchanged.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ -z "$GH_TOKEN" ]]; then
            printf '::warning::Session cookies changed, but COOKIE_UPDATE_TOKEN is not configured; DOUNAI_COOKIE was not updated.\n'
            printf '### Cookie persistence\n\nSession cookies changed, but `COOKIE_UPDATE_TOKEN` is not configured.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh secret set DOUNAI_COOKIE --repo "$GITHUB_REPOSITORY" < "$COOKIE_FILE"
          printf '::notice::DOUNAI_COOKIE was updated with the refreshed session cookies.\n'
          printf '### Cookie persistence\n\n`DOUNAI_COOKIE` was updated with refreshed session cookies.\n' >> "$GITHUB_STEP_SUMMARY"
