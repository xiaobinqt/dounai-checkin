name: Dounai session
run-name: Dounai ${{ inputs.operation || (github.event.schedule == '17,47 9,10 * * *' && 'checkin' || 'keepalive') }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        default: checkin
        type: choice
        options:
          - checkin
          - keepalive
  schedule:
    # 每三小时验证并刷新登录态。
    - cron: "23 */3 * * *"
      timezone: "Asia/Shanghai"
    # 09:17 后每 30 分钟补偿触发，直到 10:47；当天成功后自动去重。
    - cron: "17,47 9,10 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: read

concurrency:
  group: dounai-session
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Plan operation
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_OPERATION: ${{ inputs.operation }}
        run: |
          checkin_date="$(TZ=Asia/Shanghai date +%F)"
          local_time="$(TZ=Asia/Shanghai date +%H%M)"
          operation="keepalive"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            operation="$MANUAL_OPERATION"
          elif (( 10#$local_time >= 917 )); then
            # 任意延迟到 09:17 之后的定时任务都可作为当天签到兜底。
            operation="checkin"
          fi

          printf 'checkin_date=%s\n' "$checkin_date" >> "$GITHUB_OUTPUT"
          printf 'operation=%s\n' "$operation" >> "$GITHUB_OUTPUT"

      - name: Restore daily check-in state
        id: checkin-state
        if: ${{ steps.plan.outputs.operation == 'checkin' }}
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/dounai-checkin-state
          key: dounai-checkin-${{ steps.plan.outputs.checkin_date }}

      - name: Resolve operation
        id: resolve
        env:
          CACHE_HIT: ${{ steps.checkin-state.outputs.cache-hit }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          PLANNED_OPERATION: ${{ steps.plan.outputs.operation }}
          RETRY_SCHEDULE: "17,47 9,10 * * *"
        run: |
          operation="$PLANNED_OPERATION"
          skip="false"

          if [[ "$EVENT_NAME" == "schedule" && "$operation" == "checkin" && "$CACHE_HIT" == "true" ]]; then
            if [[ "$EVENT_SCHEDULE" == "$RETRY_SCHEDULE" ]]; then
              # 补偿任务无需重复构建和通知。
              skip="true"
            else
              # 原本的三小时保活任务仍继续保活。
              operation="keepalive"
            fi
          fi

          printf 'operation=%s\n' "$operation" >> "$GITHUB_OUTPUT"
          printf 'skip=%s\n' "$skip" >> "$GITHUB_OUTPUT"

      - name: Checkout public source
        if: ${{ steps.resolve.outputs.skip != 'true' }}
        uses: actions/checkout@v7
        with:
          repository: xiaobinqt/dounai-checkin
          ref: main
          path: source
          persist-credentials: false

      - name: Set up Go
        if: ${{ steps.resolve.outputs.skip != 'true' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: source/go.mod
          cache: true
          cache-dependency-path: source/go.sum

      - name: Test
        if: ${{ steps.resolve.outputs.skip != 'true' }}
        working-directory: source
        run: go test ./...

      - name: Build
        if: ${{ steps.resolve.outputs.skip != 'true' }}
        working-directory: source
        run: go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/dounai" .

      - name: Validate configuration
        if: ${{ steps.resolve.outputs.skip != 'true' }}
        env:
          DOUNAI_URL: ${{ secrets.DOUNAI_URL }}
          DOUNAI_COOKIE: ${{ secrets.DOUNAI_COOKIE }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          missing=()
          for name in DOUNAI_URL DOUNAI_COOKIE BARK_KEY; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required repository secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Keep alive or check in
        id: run
        if: ${{ steps.resolve.outputs.skip != 'true' }}
        env:
          DOUNAI_URL: ${{ secrets.DOUNAI_URL }}
          DOUNAI_COOKIE: ${{ secrets.DOUNAI_COOKIE }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER || 'https://api.day.app' }}
          EMAIL: ${{ secrets.EMAIL }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT || '0' }}
          EMAIL_AUTH_CODE: ${{ secrets.EMAIL_AUTH_CODE }}
          EMAIL_TLS: ${{ secrets.EMAIL_TLS || 'false' }}
          OPERATION: ${{ steps.resolve.outputs.operation }}
        run: |
          printf 'operation=%s\n' "$OPERATION" >> "$GITHUB_OUTPUT"
          "$RUNNER_TEMP/dounai" "$OPERATION"

          if [[ "$OPERATION" == "checkin" ]]; then
            mkdir -p "$RUNNER_TEMP/dounai-checkin-state"
            printf '%s\n' "${{ steps.plan.outputs.checkin_date }}" > "$RUNNER_TEMP/dounai-checkin-state/date"
          fi

      - name: Save daily check-in state
        if: ${{ success() && steps.run.outputs.operation == 'checkin' && steps.checkin-state.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/dounai-checkin-state
          key: dounai-checkin-${{ steps.plan.outputs.checkin_date }}
